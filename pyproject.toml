[project]
name = "facial-biometric-management-console"
version = "0.1.0"
description = "Management console — admin API and dashboard for the facial biometric platform's analytics DB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.9.0",
    "psycopg[binary]>=3.3.4",
    "openai-agents>=0.1.0",
    "pgvector>=0.5.0",
    "openai>=2.54.0",
    "reportlab>=5.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "Documents", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4"]
ignore = [
    # The repo predates these conventions; the pipeline PR does not rewrite
    # existing business logic. Revisit in a dedicated cleanup.
    "N801",  # class naming (id_validation)
]
